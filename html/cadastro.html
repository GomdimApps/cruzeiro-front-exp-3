<section class="card">
  <h2>Cadastro</h2>
  <p>Preencha o formulário abaixo. Os dados serão validados e salvos no navegador (localStorage).</p>

  <form id="cadastro-form" novalidate>
    <div class="form-field">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo" />
      <small class="error" data-error-for="nome">Informe um nome válido.</small>
    </div>

    <div class="form-field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" />
      <small class="error" data-error-for="email">Informe um e-mail válido.</small>
    </div>

    <div class="form-field">
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva algo..."></textarea>
      <small class="error" data-error-for="mensagem">A mensagem não pode ficar em branco.</small>
    </div>

    <button type="submit" class="btn">Salvar</button>
  </form>
</section>
